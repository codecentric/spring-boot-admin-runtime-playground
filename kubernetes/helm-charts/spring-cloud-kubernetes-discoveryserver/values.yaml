name: spring-cloud-kubernetes-discoveryserver
namespace: default

deployment:
  # Self-built image, see apps/spring-cloud-kubernetes-discoveryserver
  # (the official Docker Hub image is only published as SNAPSHOT)
  image: spring-cloud-kubernetes-discoveryserver
  pullPolicy: Always
  updateStrategy: RollingUpdate
  maxSurge: 100%
  maxUnavailable: 0%
  replicas: 1
  restartPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # startupProbe guards the slow JVM + Spring context initialisation phase.
  # failureThreshold * periodSeconds = maximum startup budget (30 * 10s = 300s).
  # Once it succeeds, livenessProbe takes over for runtime health checks.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 10
  livenessProbe:
    initialDelaySeconds: 0
    timeoutSeconds: 10
  readinessProbe:
    initialDelaySeconds: 0
    timeoutSeconds: 10
