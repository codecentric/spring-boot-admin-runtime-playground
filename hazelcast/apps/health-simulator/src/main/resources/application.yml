server:
  port: 8080
spring:
  application: # Application-Info for the Info-Actuator
    name: "@pom.artifactId@"
  boot:
    admin:
      client: # Self registration, like in issue 2795. Goes through the load balancer in front of the SBA nodes.
        url: ${SBA_URL:http://localhost:8080}
        period: 10s
        auto-deregistration: true
        instance:
          service-host-type: HOST_NAME # container name, reachable from all SBA nodes
          metadata:
            startup: ${random.int} # changes on every restart, see issue 2795
management: # Actuator Configuration
  # No separate management port: the PollerTracker filter must also see the actuator requests
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint: # Health-Actuator
    health:
      show-details: always
      probes:
        enabled: true
    env: # Environment-Actuator
      show-values: always # caution: can reveal passwords
    configprops: # Configuration-Actuator
      show-values: always # caution: can reveal passwords
  info: # Info-Actuator
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
info: # Application-Info for the Info-Actuator
  group: "@pom.groupId@"
  artifact: "@pom.artifactId@"
  description: "@pom.description@"
  version: "@pom.version@"
  spring-boot: "@pom.parent.version@"
  # Tags for the Spring Boot Admin UI
  tags:
    spring-boot: "@pom.parent.version@"
logging: # Logging-File for the Logfile-Actuator
  file:
    name: "health-simulator.log"
