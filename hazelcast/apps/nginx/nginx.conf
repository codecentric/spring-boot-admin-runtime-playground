upstream spring-boot-admin {
    # Round robin on purpose: UI requests and client registrations hit different nodes,
    # which is what makes cluster inconsistencies visible.
    server sba-1:8080 max_fails=1 fail_timeout=5s;
    server sba-2:8080 max_fails=1 fail_timeout=5s;
    server sba-3:8080 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://spring-boot-admin;
        proxy_set_header Host $http_host;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-SBA-Upstream $upstream_addr always;

        # Server-Sent Events used by the UI
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
