server:
  port: 8080
spring:
  application: # Application-Info for the Info-Actuator
    name: "@pom.artifactId@"
  mail: # Mailpit, used by the mail notifier to make (duplicate) notifications visible
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  # Spring Boot Admin
  boot:
    admin:
      ui:
        title: "SBA ${NODE_NAME:sba}"
      notify:
        mail:
          enabled: true
          to: ops@example.com
          # Sender contains the node name, so you can see in Mailpit which node sent a notification
          from: "SBA ${NODE_NAME:sba} <${NODE_NAME:sba}@example.com>"
          ignore-changes: "" # notify on every status change, also UNKNOWN:UP
      # Options under discussion, see README (only effective with a SBA version that contains them):
      # hazelcast:
      #   event-store-enabled: true          # PR 5739
      #   sent-notifications-enabled: true   # PR 5739
      #   notification-filters-enabled: true # PR 5739
      # endpoint-cache:
      #   enabled: false                     # PR 5266

# Playground switches, see README
playground:
  node-name: ${NODE_NAME:sba}
  hazelcast:
    cluster-name: spring-boot-admin
    # Comma separated list of members for TCP/IP join. Empty = multicast.
    members: ${HAZELCAST_MEMBERS:}
    # TTL for the event store map (0 = no TTL). Issue 2795 used 30 seconds.
    event-store-ttl-seconds: 0
    # TTL for the sent notifications map (0 = no TTL).
    sent-notifications-ttl-seconds: 0
  # hazelcast | in-memory (in-memory = workaround from issue 4773)
  event-store: hazelcast
  # properties | bean (bean = user defined MailNotifier @Bean, see PR 5726)
  notifier: properties

management: # Actuator Configuration
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint: # Health-Actuator
    health:
      show-details: always
      probes:
        enabled: true
    env: # Environment-Actuator
      show-values: always # caution: can reveal passwords
    configprops: # Configuration-Actuator
      show-values: always # caution: can reveal passwords
  info: # Info-Actuator
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
info: # Application-Info for the Info-Actuator
  group: "@pom.groupId@"
  artifact: "@pom.artifactId@"
  description: "@pom.description@"
  version: "@pom.version@"
  spring-boot: "@pom.parent.version@"
  spring-boot-admin: "@spring-boot-admin.version@"
  # Tags for the Spring Boot Admin UI
  tags:
    spring-boot: "@pom.parent.version@"
    spring-boot-admin: "@spring-boot-admin.version@"
logging: # Logging-File for the Logfile-Actuator
  file:
    name: "spring-boot-admin.log"
  level:
    de.codecentric.springbootadmin: INFO
    de.codecentric.boot.admin.server.notify: DEBUG
    com.hazelcast.internal.cluster: INFO
